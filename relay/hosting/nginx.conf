user nginx;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
    server_tokens off;
    # No request URLs, query strings, authorization headers or bodies in access logs.
    log_format relay '$request_method $status $body_bytes_sent $request_time';
    map $status $log_failure { default 0; ~^[45] 1; }
    access_log /dev/stdout relay if=$log_failure;
    client_max_body_size 4210692;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    # Railway overwrites X-Real-IP at its edge. Only its internal proxy peers may supply it.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 100.64.0.0/10;
    set_real_ip_from fc00::/7;
    real_ip_header X-Real-IP;
    limit_req_zone $binary_remote_addr zone=relay_rate:1m rate=128r/s;
    limit_conn_zone $binary_remote_addr zone=relay_connections:1m;
    server {
        listen __PORT__;
        root /opt/dialectic-relay/public;
        limit_req zone=relay_rate burst=32 nodelay;
        limit_req_status 429;
        limit_conn relay_connections 16;
        limit_conn_status 429;
        location = /health {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /opt/dialectic-relay/public/health.php;
            fastcgi_pass 127.0.0.1:9000;
        }
        location = /index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /opt/dialectic-relay/public/index.php;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_read_timeout 20s;
            fastcgi_pass 127.0.0.1:9000;
        }
        location / { return 404; }
    }
}
